<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hızlı İndir</title>
    <link rel="stylesheet" href="liquid-glass.css">
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body class="lg-theme" data-lg-style="glass" data-lg-mode="web" data-lg-theme="dark">
    <main class="lg-panel lg-stack">
      <header class="lg-row"><img src="icons/48.png" alt="" width="36" height="36"><h1 class="lg-title">Hızlı İndir</h1></header>
      <p id="page" class="lg-card page" hidden></p>
      <fieldset id="profiles" class="lg-card" aria-label="İndirme seçenekleri" hidden>
        <div>
          <label class="lg-label" for="format">Biçim</label>
          <select class="lg-input" id="format"></select>
        </div>
        <div>
          <label class="lg-label" for="quality">Kalite</label>
          <select class="lg-input" id="quality"></select>
        </div>
        <p class="hint lg-secondary">Seçimin yalnızca bu indirme için geçerli.</p>
      </fieldset>
      <button class="lg-button lg-button--primary" id="send" type="button" disabled>Bu sekmeyi gönder</button>
      <p class="lg-secondary" id="status" role="status">Sekme kontrol ediliyor…</p>
      <a id="setup" href="https://github.com/wiski-i/Starlit-DeskDownloader/releases" target="_blank" rel="noreferrer" hidden>Windows indirme sayfası</a>
    </main>
  </body>
</html>
